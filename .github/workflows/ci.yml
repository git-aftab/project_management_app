name: PMS Backend CI

on:
  push:
    branches: [main]

  Pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          -27017:27017
        
      redis:
        image: redis:7
        ports:
          -6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
    setps:
      - name: Checkout Repository
        uses: actions/checkout/@v4

      - name: setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install Dependencies
        working-directory: Backend
        run: npm ci

      - name: Run Tests
        working-directory: Backend
        run: npm run test:run
        env:
          NODE_ENV: test
          REDIS_URL: redis://127.0.0.1:6379